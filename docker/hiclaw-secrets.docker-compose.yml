# =============================================================================
# HiClaw Docker Secrets Fragment
# =============================================================================
# This file defines Docker secrets for production Swarm mode deployments.
#
# IMPORTANT - Docker Secrets Requirements:
#   - Docker Secrets only work in Docker Swarm mode
#   - Requires: docker swarm init (single node) or swarm cluster (multi-node)
#   - Secrets are encrypted at rest and in transit
#   - Secrets appear to containers at /run/secrets/<secret_name>
#
# Usage:
#   1. Initialize swarm: docker swarm init
#   2. Create secrets: ./create-secrets.sh /path/to/secrets/
#      OR manually: echo -n "secret_value" | docker secret create <secret_name> -
#   3. Deploy: docker-compose -f docker-compose.yml -f docker-compose.prod.yml -f docker/hiclaw-secrets.docker-compose.yml up
#
# =============================================================================

# =============================================================================
# Secrets Definitions
# =============================================================================
# Each secret maps to a file at /run/secrets/<secret_name> inside the container
# =============================================================================
secrets:
  # ---------------------------------------------------------------------------
  # Matrix Credentials
  # ---------------------------------------------------------------------------
  hiclaw_matrix_access_token:
    file: /run/secrets/hiclaw_matrix_access_token
    # Description: Matrix access token for hermes-manager
    # Required: YES
    # Generated via: curl -X POST -d '{"type":"m.login.password","identifier":{"type":"m.id.user","user":"@manager:your-server"},"password":"your-password"}' http://localhost:8008/_matrix/client/r0/login

  hiclaw_matrix_user_id:
    file: /run/secrets/hiclaw_matrix_user_id
    # Description: Matrix user ID (MXID) for hermes-manager (e.g., @hermes-manager:hermes.local)
    # Required: YES

  hiclaw_matrix_homeserver_url:
    file: /run/secrets/hiclaw_matrix_homeserver_url
    # Description: Matrix homeserver URL (e.g., http://synapse:8008)
    # Required: YES

  # ---------------------------------------------------------------------------
  # MinIO Credentials
  # ---------------------------------------------------------------------------
  hiclaw_minio_access_key:
    file: /run/secrets/hiclaw_minio_access_key
    # Description: MinIO access key for object storage
    # Required: YES
    # Default: hiclawadmin

  hiclaw_minio_secret_key:
    file: /run/secrets/hiclaw_minio_secret_key
    # Description: MinIO secret key for object storage
    # Required: YES

  # ---------------------------------------------------------------------------
  # Worker API Key
  # ---------------------------------------------------------------------------
  hiclaw_worker_api_key:
    file: /run/secrets/hiclaw_worker_api_key
    # Description: API key for worker-to-manager authentication
    # Required: YES
