[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[include]
files=/etc/supervisor/conf.d/*.conf

[program:manager-agent]
command=/usr/local/bin/hermes-entrypoint.sh exec
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/manager-agent-stdout.log
stderr_logfile=/var/log/supervisor/manager-agent-stderr.log
