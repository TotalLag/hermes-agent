[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[include]
files=/etc/supervisor/conf.d/*.conf

# ---------------------------------------------------------------------------
# Infrastructure: minio
# ---------------------------------------------------------------------------
[program:minio]
command=/opt/hiclaw/scripts/init/minio.sh
autostart=true
autorestart=true
startretries=5
startseconds=15
priority=10
stdout_logfile=/var/log/supervisor/minio-stdout.log
stderr_logfile=/var/log/supervisor/minio-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Infrastructure: tuwunel (Matrix homeserver)
# ---------------------------------------------------------------------------
[program:tuwunel]
command=/opt/hiclaw/scripts/init/tuwunel.sh
autostart=true
autorestart=true
startretries=5
startseconds=20
priority=20
stdout_logfile=/var/log/supervisor/tuwunel-stdout.log
stderr_logfile=/var/log/supervisor/tuwunel-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Infrastructure: setup-host-symlinks
# ---------------------------------------------------------------------------
[program:setup-host-symlinks]
command=/opt/hiclaw/scripts/init/setup-host-symlinks.sh
autostart=true
autorestart=false
startseconds=5
priority=30
stdout_logfile=/var/log/supervisor/setup-host-symlinks-stdout.log
stderr_logfile=/var/log/supervisor/setup-host-symlinks-stderr.log

# ---------------------------------------------------------------------------
# Infrastructure: mc-mirror (MinIO mirror, waits for minio)
# ---------------------------------------------------------------------------
[program:mc-mirror]
command=/opt/hiclaw/scripts/init/mc-mirror.sh
autostart=true
autorestart=true
startretries=5
startseconds=15
priority=100
stdout_logfile=/var/log/supervisor/mc-mirror-stdout.log
stderr_logfile=/var/log/supervisor/mc-mirror-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Higress: apiserver
# ---------------------------------------------------------------------------
[program:higress-apiserver]
command=/usr/local/bin/start-apiserver.sh
autostart=true
autorestart=true
startretries=5
startseconds=10
priority=200
environment=ENVIRONMENT="MANAGER",MODE="full",O11Y="off",GATEWAY_CONCURRENCY=16,PILOT_FILTER_GATEWAY_CLUSTER_CONFIG="true",POD_NAME="hermes-manager",POD_NAMESPACE="hermes",ENABLE_CONSOLE_ROUTE="true"
stdout_logfile=/var/log/supervisor/higress-apiserver-stdout.log
stderr_logfile=/var/log/supervisor/higress-apiserver-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Higress: controller
# ---------------------------------------------------------------------------
[program:higress-controller]
command=/usr/local/bin/start-controller.sh
autostart=true
autorestart=true
startretries=5
startseconds=15
priority=300
environment=ENVIRONMENT="MANAGER",MODE="full",O11Y="off",GATEWAY_CONCURRENCY=16,PILOT_FILTER_GATEWAY_CLUSTER_CONFIG="true",POD_NAME="hermes-manager",POD_NAMESPACE="hermes",CONTROLLER_KEEP_XDS_CONFIG_LABELS="true"
stdout_logfile=/var/log/supervisor/higress-controller-stdout.log
stderr_logfile=/var/log/supervisor/higress-controller-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Higress: pilot (XDS)
# ---------------------------------------------------------------------------
[program:higress-pilot]
command=/usr/local/bin/start-pilot.sh
autostart=true
autorestart=true
startretries=5
startseconds=20
priority=400
environment=ENVIRONMENT="MANAGER",MODE="full",O11Y="off",GATEWAY_CONCURRENCY=16,PILOT_FILTER_GATEWAY_CLUSTER_CONFIG="true",POD_NAME="hermes-manager",POD_NAMESPACE="hermes",PILOT_ENABLE_ANALYSIS="false",PILOT_ENABLE_CONFIG_DISTRIBUTION_TRACKING="false",ISTIO_DIGEST="hermes-managed",ISTIO_META_OWNER="hermes-manager",JWT_POLICY="third-party-jwt",CA_ROOT_CA=""
stdout_logfile=/var/log/supervisor/higress-pilot-stdout.log
stderr_logfile=/var/log/supervisor/higress-pilot-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Higress: gateway
# ---------------------------------------------------------------------------
[program:higress-gateway]
command=/usr/local/bin/start-gateway.sh
autostart=true
autorestart=true
startretries=5
startseconds=20
priority=500
environment=ENVIRONMENT="MANAGER",MODE="full",O11Y="off",GATEWAY_CONCURRENCY=16,PILOT_FILTER_GATEWAY_CLUSTER_CONFIG="true",POD_NAME="hermes-manager",POD_NAMESPACE="hermes",JWT_POLICY="third-party-jwt",CA_ROOT_CA=""
stdout_logfile=/var/log/supervisor/higress-gateway-stdout.log
stderr_logfile=/var/log/supervisor/higress-gateway-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Higress: console (admin UI)
# ---------------------------------------------------------------------------
[program:higress-console]
command=/usr/local/bin/start-console.sh
autostart=true
autorestart=true
startretries=5
startseconds=10
priority=600
stdout_logfile=/var/log/supervisor/higress-console-stdout.log
stderr_logfile=/var/log/supervisor/higress-console-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# UI: element-web
# ---------------------------------------------------------------------------
[program:element-web]
command=/opt/hiclaw/scripts/init/element-web.sh
priority=650
autostart=true
autorestart=true
startretries=5
startseconds=15
stdout_logfile=/var/log/supervisor/element-web-stdout.log
stderr_logfile=/var/log/supervisor/element-web-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ---------------------------------------------------------------------------
# Agent: hermes-agent (runs init_manager then hermes gateway start)
# ---------------------------------------------------------------------------
[program:manager-agent]
command=/usr/local/bin/run-gateway.sh
autostart=true
autorestart=true
startretries=3
startseconds=30
priority=700
stdout_logfile=/var/log/supervisor/manager-agent-stdout.log
stderr_logfile=/var/log/supervisor/manager-agent-stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
